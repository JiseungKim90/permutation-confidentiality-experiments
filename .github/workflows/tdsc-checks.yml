name: TDSC artifact checks

on:
  push:
    paths:
      - "tdsc/**"
      - ".github/workflows/tdsc-checks.yml"
  pull_request:
    paths:
      - "tdsc/**"
      - ".github/workflows/tdsc-checks.yml"

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tdsc/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tdsc/requirements.txt
      - name: Run release audit and regressions
        working-directory: tdsc
        run: python scripts/run_checks.py
